<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sondaj — Projection</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.2.2/wordcloud2.min.js"></script>
</head>
<body class="projection">

<div id="scene"></div>

<script type="module">
import { subscribeQuestionProjetee, subscribeReponses } from "./js/data-layer.js";

const params = new URLSearchParams(location.search);
const confId = params.get("conf");
const scene = document.getElementById("scene");
let stopReponses = null;
let questionCourante = null;
let nbPrecedent = 0;

function ecranAccueil() {
  scene.innerHTML = `<div class="proj-attente">
    <div class="marque-geante">SONDAJ <span>· CAP2030</span></div>
    <p>Comprendre. Anticiper. Proposer pour Agir.</p>
    <div class="qr-invite">📱 Scannez le QR code pour participer${confId ? ` — code : <strong>${confId}</strong>` : ""}</div>
  </div>`;
}

if (!confId) {
  ecranAccueil();
} else {
  ecranAccueil();
  subscribeQuestionProjetee(confId, q => {
    if (stopReponses) { stopReponses(); stopReponses = null; }
    questionCourante = q;
    nbPrecedent = 0;
    if (!q) { ecranAccueil(); return; }
    monterScene(q);
    stopReponses = subscribeReponses(confId, q.id, reps => rendre(q, reps));
  });
}

function monterScene(q) {
  scene.innerHTML = `<div class="proj-scene">
    <div>
      <div class="proj-titre">${q.texte.replace(/\*(.+?)\*/g, '<span class="souligne">$1</span>')}</div>
      <div class="proj-compteur"><span class="n" id="compteur">0</span> réponse(s)${q.statut === "fermee" ? " — vote clos" : ""}</div>
    </div>
    <div class="proj-zone" id="zone"></div>
  </div>`;
}

function rendre(q, reps) {
  const zone = document.getElementById("zone");
  const compteur = document.getElementById("compteur");
  if (!zone) return;

  compteur.textContent = reps.length;
  if (reps.length > nbPrecedent) {
    compteur.parentElement.classList.remove("pouls");
    void compteur.parentElement.offsetWidth;
    compteur.parentElement.classList.add("pouls");
  }
  nbPrecedent = reps.length;

  if (q.type === "qcm") rendreBarres(zone, q, reps);
  else if (q.type === "ouverte") rendreMur(zone, reps);
  else if (q.type === "nuage") rendreNuage(zone, reps);
  else if (q.type === "curseur") rendreJauge(zone, q, reps);
}

/* ---------- QCM : barres animées ---------- */
function rendreBarres(zone, q, reps) {
  const compte = {};
  (q.options || []).forEach(o => compte[o] = 0);
  reps.forEach(r => {
    const vals = Array.isArray(r.valeur) ? r.valeur : [r.valeur];
    vals.forEach(v => { if (v in compte) compte[v]++; });
  });
  const total = Object.values(compte).reduce((a, b) => a + b, 0) || 1;

  if (!zone.querySelector(".barres")) {
    zone.innerHTML = `<div class="barres">` + (q.options || []).map(o =>
      `<div class="barre-ligne">
        <div class="barre-label">${o}</div>
        <div class="barre-rail"><div class="barre-remplie" data-opt="${o}"></div></div>
        <div class="barre-pct" data-pct="${o}">0 %</div>
      </div>`).join("") + `</div>`;
  }
  (q.options || []).forEach(o => {
    const pct = Math.round(compte[o] / total * 100);
    zone.querySelector(`[data-opt="${CSS.escape(o)}"]`).style.width = pct + "%";
    zone.querySelector(`[data-pct="${CSS.escape(o)}"]`).textContent = pct + " %";
  });
}

/* ---------- Ouvertes : mur de post-its organique ---------- */

/** Petit hachage déterministe : un même identifiant donne toujours
    le même nombre — la rotation d'un post-it ne change donc jamais,
    même quand le mur est redessiné. */
function hacher(chaine) {
  let h = 0;
  for (let i = 0; i < chaine.length; i++) {
    h = (h * 31 + chaine.charCodeAt(i)) >>> 0;
  }
  return h;
}

function rendreMur(zone, reps) {
  if (!zone.querySelector(".mur")) {
    const nbCols = Math.max(2, Math.min(5, Math.floor(zone.clientWidth / 340)));
    zone.innerHTML = `<div class="mur">` +
      Array.from({ length: nbCols }, () => `<div class="mur-col"></div>`).join("") +
      `</div>`;
  }
  const cols = [...zone.querySelectorAll(".mur-col")];
  const dejaAffiches = new Set(
    [...zone.querySelectorAll(".postit")].map(c => c.dataset.id)
  );

  reps.forEach(r => {
    if (dejaAffiches.has(r.id)) return;
    const h = hacher(r.id);
    const p = document.createElement("div");
    // rotation persistante entre -3,5° et +3,5°, teinte stable, dérivées de l'id
    p.className = "postit teinte-" + (h % 4);
    p.style.setProperty("--rot", (((h % 71) / 10) - 3.5).toFixed(1) + "deg");
    p.dataset.id = r.id;
    p.innerHTML = `${echap(String(r.valeur))}${r.prenom ? `<span class="auteur">— ${echap(r.prenom)}</span>` : ""}`;
    p.onclick = () => mettreEnVedette(zone, p);
    // façon main humaine : le post-it rejoint la colonne la moins remplie
    const colCourte = cols.reduce((a, b) => (b.offsetHeight < a.offsetHeight ? b : a), cols[0]);
    colCourte.appendChild(p);
  });
}

function mettreEnVedette(zone, p) {
  const deja = zone.querySelector(".postit.vedette");
  const voile = zone.querySelector(".voile");
  if (deja) { deja.classList.remove("vedette"); voile?.remove(); if (deja === p) return; }
  const v = document.createElement("div");
  v.className = "voile";
  v.onclick = () => { p.classList.remove("vedette"); v.remove(); };
  zone.appendChild(v);
  p.classList.add("vedette");
}

/* ---------- Nuage de mots ---------- */
function rendreNuage(zone, reps) {
  if (!zone.querySelector("#nuage-canvas")) {
    zone.innerHTML = `<canvas id="nuage-canvas"></canvas>`;
  }
  const canvas = zone.querySelector("#nuage-canvas");
  canvas.width = zone.clientWidth;
  canvas.height = zone.clientHeight;

  const freq = {};
  reps.forEach(r => {
    String(r.valeur).toLowerCase().split(/[\s,;]+/).forEach(mot => {
      mot = mot.replace(/[^\p{L}\p{N}'-]/gu, "");
      if (mot.length > 1) freq[mot] = (freq[mot] || 0) + 1;
    });
  });
  const liste = Object.entries(freq);
  if (!liste.length) return;

  const max = Math.max(...liste.map(([, n]) => n));
  const palette = ["#F1BD10", "#2FA8C7", "#4fc08d", "#f08a76", "#b9a1ee", "#ffffff"];
  WordCloud(canvas, {
    list: liste,
    gridSize: 14,
    weightFactor: n => 18 + (n / max) * (canvas.height / 6),
    fontFamily: "Montserrat, sans-serif",
    fontWeight: 700,
    color: () => palette[Math.floor(Math.random() * palette.length)],
    backgroundColor: "transparent",
    rotateRatio: 0.15,
    shuffle: false,
    drawOutOfBound: false
  });
}

/* ---------- Curseur : jauge collective ---------- */
function rendreJauge(zone, q, reps) {
  if (!zone.querySelector(".jauge-scene")) {
    zone.innerHTML = `<div class="jauge-scene">
      <div class="jauge-rail" id="rail">
        <div class="jauge-moyenne" id="moy" style="left:50%"><span class="val">–</span></div>
      </div>
      <div class="jauge-extremes"><span>${echap(q.gauche || "0")}</span><span>${echap(q.droite || "100")}</span></div>
    </div>`;
  }
  const rail = zone.querySelector("#rail");
  const vals = reps.map(r => Number(r.valeur)).filter(n => !isNaN(n));

  rail.querySelectorAll(".jauge-point").forEach(p => p.remove());
  vals.forEach(v => {
    const pt = document.createElement("div");
    pt.className = "jauge-point";
    pt.style.left = v + "%";
    rail.appendChild(pt);
  });

  if (vals.length) {
    const moyenne = vals.reduce((a, b) => a + b, 0) / vals.length;
    const moy = zone.querySelector("#moy");
    moy.style.left = moyenne + "%";
    moy.querySelector(".val").textContent = Math.round(moyenne);
  }
}

function echap(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}
</script>
</body>
</html>
